<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - My Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body {
    font-family: 'Orbitron', sans-serif;
    margin: 0;
    padding: 20px;
    color: #d8eaff;
    background: #03030a;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('NGC-5033-by-R.-Jay-GaBany.jpg') center/cover no-repeat fixed;
    opacity: 0.35;
    animation: moveStars 90s linear infinite;
    pointer-events: none;
}

@keyframes moveStars {
    from { background-position: 0 0; }
    to { background-position: -3000px -3000px; }
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: auto;
}

.header-right {
    display: flex;
    gap: 12px;
    align-items: center;
}

.header a {
    color: #7bbcff;
    text-decoration: none;
}

.theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #3b82f6;
    background: rgba(20,35,70,0.6);
    color: #d8eaff;
    font-size: 18px;
    cursor: pointer;
}

.box, .card {
    max-width: 900px;
    margin: 30px auto;
    background: rgba(12,20,40,0.6);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(0,100,255,0.25);
    backdrop-filter: blur(10px);
}

.file-item {
    list-style: none;
    background: rgba(20,35,70,0.55);
    margin: 12px 0;
    padding: 14px 18px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
}

.file-drop {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    border: 2px dashed #3b82f6;
    border-radius: 10px;
    cursor: pointer;
}

.btn-upload {
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg,#0040ff,#8800ff);
    color: white;
    cursor: pointer;
}

/* FILE PREVIEW */
.file-preview {
    margin-top: 10px;
    font-size: 13px;
    color: #cbd5e1;
}
.file-preview img {
    max-height: 70px;
    margin-top: 8px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,120,255,0.4);
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    z-index: 999;
}

.modal-box {
    background: #0c1428;
    color: #d8eaff;
    max-width: 300px;
    margin: 30vh auto;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.actions button,
.actions a {
    flex: 1;
    height: 40px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-decoration: none;

    display: flex;              /* supaya teks bisa center vertikal */
    align-items: center;        /* vertikal center */
    justify-content: center;    /* horizontal center */
    font-family: 'Orbitron', sans-serif;  /* samakan font */
    font-weight: 600;           /* optional, kalau mau tebal */
    font-size: 14px;            /* optional, samakan ukuran */
}


.actions .confirm {
    background: #ff0055;
    color: white;
}

/* LIGHT MODE */
body.light {
    background: #eaf2ff;
    color: #0f172a;
}

body.light::before { opacity: 0.12; }

body.light .box,
body.light .card {
    background: rgba(255,255,255,0.75);
}

body.light .file-item,
body.light .file-drop {
    background: rgba(220,230,255,0.75);
    color: #0f172a;
}

body.light .modal-box {
    background: #f1f5ff;
    color: #0f172a;
}
</style>
</head>

<body>

<div class="header">
    <h2>🌌 Halo, <span id="username">User</span></h2>
    <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <a href="javascript:void(0)" onclick="openLogoutModal()">Logout</a>
    </div>
</div>

<div class="card">
    <h3>📤 Upload File</h3>

    <label class="file-drop">
        <input type="file" id="fileInput" hidden onchange="previewFile(this)">
        Klik pilih file
    </label>

    <div id="filePreview" class="file-preview"></div>

    <button class="btn-upload" onclick="uploadFile()">🚀 Upload</button>

    <p id="uploadMessage"></p>
</div>

<div class="box">
    <h3>📂 File Saya</h3>
    <ul id="fileList"></ul>
</div>

<!-- LOGOUT MODAL -->
<div id="logoutModal" class="modal">
    <div class="modal-box">
        <h3>Logout</h3>
        <p>Yakin ingin keluar dari akun?</p>
        <div class="actions">
            <button onclick="closeLogoutModal()">Batal</button>
            <button class="confirm" onclick="logout()">Ya, Logout</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://ajibakkrxavmyzyolbbw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqaWJha2tyeGF2bXl6eW9sYmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3Mzk2ODMsImV4cCI6MjA4MjMxNTY4M30.-A-wkQZtRTl8qNiWe2yyWkKt6WbtYYtYTA_KWlhEtQw";

// Inisialisasi Client
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usernameEl = document.getElementById("username");
const fileList = document.getElementById("fileList");
const uploadMessage = document.getElementById("uploadMessage");

let currentUser = null;

/* ================= AUTH CHECK ================= */
(async () => {
    // PERBAIKAN: Gunakan sbClient
    const { data } = await sbClient.auth.getUser(); 
    if (!data.user) {
        location.href = "login.html";
        return;
    }

    currentUser = data.user;
    usernameEl.textContent = currentUser.email;
    loadFiles();
})();

/* ================= LIST FILE ================= */
async function loadFiles() {
    // PERBAIKAN: Gunakan sbClient
    const { data } = await sbClient
        .storage
        .from("files")
        .list(currentUser.id);

    fileList.innerHTML = "";

    if (data) {
        data.forEach(file => {
            const li = document.createElement("li");
            li.className = "file-item";

            const span = document.createElement("span");
            span.textContent = file.name;

            const link = document.createElement("a");
            link.textContent = "⬇ Download";
            // PERBAIKAN: Gunakan sbClient
            link.href = sbClient.storage
                .from("files")
                .getPublicUrl(`${currentUser.id}/${file.name}`)
                .data.publicUrl;

            li.appendChild(span);
            li.appendChild(link);
            fileList.appendChild(li);
        });
    }
}

/* ================= UPLOAD ================= */
async function uploadFile() {
    const input = document.getElementById("fileInput");
    const file = input.files[0];

    if (!file) {
        alert("Pilih file dulu");
        return;
    }

    const filePath = `${currentUser.id}/${Date.now()}-${file.name}`;

    // Gunakan sbClient
    const { data, error } = await sbClient.storage 
        .from("files")
        .upload(filePath, file, {
            cacheControl: "3600",
            upsert: true
        });

    if (error) {
        uploadMessage.textContent = "❌ " + error.message;
        return;
    }

    uploadMessage.textContent = "✅ Upload berhasil";
    input.value = "";
    loadFiles();
}

/* ================= LOGOUT ================= */
window.logout = async () => {
    // Gunakan sbClient
    const { error } = await sbClient.auth.signOut(); 
    if (error) {
        alert("Gagal logout: " + error.message);
    } else {
        location.href = "login.html"; 
    }
};
</script>

<script>
function previewFile(input) {
    const file = input.files[0];
    const preview = document.getElementById("filePreview");
    preview.innerHTML = "";

    if (file && file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
    } else if (file) {
        preview.textContent = "📎 File siap diupload";
    }
}

function openLogoutModal() {
    document.getElementById("logoutModal").style.display = "block";
}
function closeLogoutModal() {
    document.getElementById("logoutModal").style.display = "none";
}

/* ================= THEME ================= */
function toggleTheme() {
    document.body.classList.toggle("light");
    localStorage.setItem(
        "theme",
        document.body.classList.contains("light") ? "light" : "dark"
    );
    document.querySelector(".theme-toggle").innerHTML =
        document.body.classList.contains("light") ? "☀️" : "🌙";
}

window.onload = () => {
    if (localStorage.getItem("theme") === "light") {
        document.body.classList.add("light");
        document.querySelector(".theme-toggle").innerHTML = "☀️";
    }
};
</script>

</body>
</html>
