<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 20px;
            color: #d8eaff;
            background: #03030a;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('NGC-5033-by-R.-Jay-GaBany.jpg') center/cover no-repeat fixed;
            opacity: 0.35;
            animation: moveStars 90s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -3000px -3000px; }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: auto;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header a {
            color: #ff4d4d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #3b82f6;
            background: rgba(20,35,70,0.6);
            color: #d8eaff;
            font-size: 18px;
            cursor: pointer;
        }

        .box, .card {
            max-width: 900px;
            margin: 30px auto;
            background: rgba(12,20,40,0.6);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0,100,255,0.25);
            backdrop-filter: blur(10px);
        }

        .file-item {
            list-style: none;
            background: rgba(20,35,70,0.55);
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-drop {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            border: 2px dashed #3b82f6;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-upload {
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg,#0040ff,#8800ff);
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 999;
        }

        .modal-box {
            background: #0c1428;
            color: #d8eaff;
            max-width: 300px;
            margin: 30vh auto;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .actions {
            display: flex; gap: 10px; margin-top: 15px;
        }

        .actions button {
            flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Orbitron', sans-serif;
        }

        .actions .confirm { background: #ff0055; color: white; }

        body.light { background: #eaf2ff; color: #0f172a; }
        body.light .box, body.light .card { background: rgba(255,255,255,0.75); color: #0f172a; }
        body.light .file-item { background: rgba(200,220,255,0.8); }
    </style>
</head>
<body>

<div class="header">
    <h2>🌌 Halo, <span id="username">User</span></h2>
    <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <a onclick="openLogoutModal()">Logout</a>
    </div>
</div>

<div class="card">
    <h3>📤 Upload File</h3>
    <label class="file-drop">
        <input type="file" id="fileInput" hidden onchange="previewFile(this)">
        Klik pilih file
    </label>
    <div id="filePreview" style="margin-top: 10px; font-size: 12px;"></div>
    <button class="btn-upload" onclick="uploadFile()">🚀 Upload</button>
    <p id="uploadMessage" style="font-size: 12px;"></p>
</div>

<div class="box">
    <h3>📂 File Saya</h3>
    <ul id="fileList"></ul>
</div>

<div id="logoutModal" class="modal">
    <div class="modal-box">
        <h3>Logout</h3>
        <p>Yakin ingin keluar?</p>
        <div class="actions">
            <button onclick="closeLogoutModal()">Batal</button>
            <button class="confirm" onclick="logout()">Ya, Logout</button>
        </div>
    </div>
</div>

<script>
// KONFIGURASI
const SUPABASE_URL = "https://ajibakkrxavmyzyolbbw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqaWJha2tyeGF2bXl6eW9sYmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3Mzk2ODMsImV4cCI6MjA4MjMxNTY4M30.-A-wkQZtRTl8qNiWe2yyWkKt6WbtYYtYTA_KWlhEtQw";
const BUCKET_NAME = "uploads"; // NAMA BUCKET KAMU

const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usernameEl = document.getElementById("username");
const fileList = document.getElementById("fileList");
const uploadMessage = document.getElementById("uploadMessage");

let currentUser = null;

// INITIALIZE DASHBOARD
(async () => {
    // Cek Tema
    if (localStorage.getItem("theme") === "light") {
        document.body.classList.add("light");
        document.querySelector(".theme-toggle").innerHTML = "☀️";
    }

    // Cek User
    const { data: { user } } = await sbClient.auth.getUser();
    if (!user) {
        window.location.replace("login.html");
        return;
    }

    currentUser = user;
    
    // Tampilkan Nama dari Metadata
    const name = currentUser.user_metadata?.username || currentUser.email;
    usernameEl.textContent = name;

    loadFiles();
})();

// FUNGSI STORAGE
async function loadFiles() {
    const { data, error } = await sbClient.storage.from(BUCKET_NAME).list(currentUser.id);
    
    fileList.innerHTML = "";
    if (error) {
        fileList.innerHTML = "<li>Gagal memuat file: " + error.message + "</li>";
        return;
    }

    if (data.length === 0) {
        fileList.innerHTML = "<p style='opacity:0.5'>Belum ada file.</p>";
        return;
    }

    data.forEach(file => {
        const publicUrl = sbClient.storage.from(BUCKET_NAME).getPublicUrl(`${currentUser.id}/${file.name}`).data.publicUrl;
        const li = document.createElement("li");
        li.className = "file-item";
        li.innerHTML = `
            <span>${file.name}</span>
            <div>
                <a href="${publicUrl}" target="_blank" style="text-decoration:none; margin-right:15px;">⬇️</a>
                <button onclick="deleteFile('${file.name}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
            </div>
        `;
        fileList.appendChild(li);
    });
}

async function uploadFile() {
    const input = document.getElementById("fileInput");
    const file = input.files[0];
    if (!file) return alert("Pilih file dulu!");

    uploadMessage.textContent = "⏳ Mengupload...";
    const filePath = `${currentUser.id}/${Date.now()}-${file.name}`;
    
    const { error } = await sbClient.storage.from(BUCKET_NAME).upload(filePath, file);

    if (error) {
        uploadMessage.textContent = "❌ " + error.message;
    } else {
        uploadMessage.textContent = "✅ Berhasil!";
        input.value = "";
        document.getElementById("filePreview").innerHTML = "";
        loadFiles();
    }
}

async function deleteFile(name) {
    if (!confirm("Hapus file ini?")) return;
    const { error } = await sbClient.storage.from(BUCKET_NAME).remove([`${currentUser.id}/${name}`]);
    if (error) alert("Gagal: " + error.message);
    else loadFiles();
}

// UI HELPERS
window.logout = async () => {
    await sbClient.auth.signOut();
    window.location.replace("login.html");
};

window.openLogoutModal = () => document.getElementById("logoutModal").style.display = "block";
window.closeLogoutModal = () => document.getElementById("logoutModal").style.display = "none";

window.toggleTheme = () => {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    localStorage.setItem("theme", isLight ? "light" : "dark");
    document.querySelector(".theme-toggle").innerHTML = isLight ? "☀️" : "🌙";
};

function previewFile(input) {
    const preview = document.getElementById("filePreview");
    preview.textContent = input.files[0] ? "📎 " + input.files[0].name : "";
}
</script>
</body>
</html>
