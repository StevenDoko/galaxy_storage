<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Galaxy Storage</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

/* ===== BASE ===== */
* { box-sizing: border-box; }

body {
    font-family: 'Orbitron', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d8eaff;
    background: #03030a;
    overflow: hidden;
}

/* ===== STARFIELD ===== */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('NGC-5033-by-R.-Jay-GaBany.jpg') center/cover no-repeat fixed;
    opacity: 0.35;
    animation: moveStars 90s linear infinite;
    z-index: -2;
}

@keyframes moveStars {
    from { background-position: 0 0; }
    to   { background-position: -3000px -3000px; }
}

/* ===== NEBULA ===== */
.nebula {
    position: fixed;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(0,140,255,.35), transparent 70%);
    filter: blur(120px);
    animation: float 22s ease-in-out infinite;
    z-index: -1;
}

@keyframes float {
    0%   { transform: translate(-180px,-180px); }
    50%  { transform: translate(180px,180px); }
    100% { transform: translate(-180px,-180px); }
}

/* ===== CARD ===== */
.card {
    width: 440px;
    padding: 38px;
    border-radius: 18px;
    background: rgba(12,20,40,.65);
    backdrop-filter: blur(14px);
    box-shadow:
        0 0 30px rgba(0,120,255,.35),
        inset 0 0 30px rgba(0,120,255,.15);
    animation: fadeUp .8s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 26px;
    color: #79b8ff;
    text-shadow: 0 0 15px #2b58ff;
}

/* ===== FORM ===== */
form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,.08);
    color: #d8eaff;
    font-size: 14px;
}

input::placeholder { color: #9bbcff; }

input:focus {
    outline: none;
    box-shadow: 0 0 12px #4da6ff;
}

/* ===== BUTTON ===== */
button {
    margin-top: 8px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 16px;
    color: white;
    background: linear-gradient(90deg,#0040ff,#8800ff);
    box-shadow: 0 0 20px #5500ff;
    cursor: pointer;
    transition: .25s ease;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px #9900ff;
}

/* ===== TEXT ===== */
p {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
}

a {
    color: #7bbcff;
    text-decoration: none;
}

.error {
    text-align: center;
    color: #ff7b7b;
    margin-bottom: 10px;
}

/* ===== THEME TOGGLE (CENTER FIX) ===== */
.theme-btn {
    position: fixed;
    top: 20px;
    right: 24px;

    width: 42px;
    height: 42px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(10,15,40,.55);
    border: 1px solid rgba(120,160,255,.25);
    backdrop-filter: blur(8px);

    font-size: 18px;
    line-height: 1;
    color: #9ecbff;

    cursor: pointer;
    z-index: 999;

    box-shadow:
        0 0 10px rgba(80,120,255,.4),
        inset 0 0 8px rgba(80,120,255,.25);

    transition: .25s ease;
}

.theme-btn:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<div class="nebula"></div>

<button id="themeToggle" class="theme-btn">🌙</button>

<div class="card">
    <h2>Create Account</h2>

    <div id="error" class="error" style="display:none;"></div>

    <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Daftar</button>
    </form>

    <p>Sudah punya akun? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("signupForm");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const username = document.getElementById("username").value;

    const { error } = await supabase.auth.signUp({
        email,
        password,
        options: {
            data: { username }
        }
    });

    if (error) {
        errorBox.style.display = "block";
        errorBox.textContent = error.message;
    } else {
        alert("Akun berhasil dibuat! Silakan login.");
        window.location.href = "login.html";
    }
});
</script>

<script>
const toggle = document.getElementById("themeToggle");
let dark = true;

toggle.addEventListener("click", () => {
    dark = !dark;
    document.body.style.background = dark ? "#03030a" : "#f4f7ff";
    document.body.style.color = dark ? "#d8eaff" : "#111";
    toggle.textContent = dark ? "🌙" : "☀️";
});
</script>

</body>
</html>
