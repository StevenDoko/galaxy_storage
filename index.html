<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Storage</title>

<link rel="stylesheet" href="style.css">

<style>
/* ===== CSS ASLI KAMU (TIDAK DIUBAH) ===== */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');
body {
    font-family: 'Orbitron', sans-serif;
    margin: 0;
    padding: 20px;
    color: #d8eaff;
    animation: fadeIn 1s ease;
    background: #03030a;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('NGC-5033-by-R.-Jay-GaBany.jpg') center/cover no-repeat fixed;
    opacity: 0.35;
    animation: moveStars 90s linear infinite;
    pointer-events: none;
}
@keyframes moveStars {
    from { background-position: 0 0; }
    to { background-position: -3000px -3000px; }
}
.nebula {
    position: fixed;
    width: 900px;
    height: 900px;
    top: -250px;
    left: -250px;
    background: radial-gradient(circle, rgba(150,0,255,0.3), transparent 70%);
    filter: blur(100px);
    animation: floatNebula 20s ease-in-out infinite;
    pointer-events: none;
}
@keyframes floatNebula {
    0% { transform: translate(0, 0); opacity: 0.3; }
    50% { transform: translate(100px, 150px); opacity: 0.6; }
    100% { transform: translate(0, 0); opacity: 0.3; }
}
.theme-btn {
    position: fixed;
    top: 20px;
    right: 24px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(10, 15, 40, 0.55);
    border: 1px solid rgba(120,160,255,0.25);
    backdrop-filter: blur(8px);
    color: #9ecbff;
    font-size: 18px;
    cursor: pointer;
    z-index: 999;
}
h2 {
    text-align: center;
    font-size: 36px;
    color: #79b8ff;
    margin-top: 80px;
}
.box {
    max-width: 500px;
    margin: 60px auto;
    background: rgba(12, 20, 40, 0.6);
    padding: 35px;
    border-radius: 16px;
    text-align: center;
}
.btn {
    display: block;
    margin: 18px auto;
    padding: 15px;
    width: 260px;
    background: linear-gradient(90deg, #0040ff, #8800ff);
    color: white;
    text-decoration: none;
    font-size: 18px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="nebula"></div>
<button id="themeToggle" class="theme-btn">🌙</button>

<h2>GALAXY STORAGE</h2>

<div class="box">
    <p class="desc">
        Secure personal cloud storage <br>
        Upload • Manage • Download your files
    </p>

    <a class="btn" href="login.html">Login</a>
    <a class="btn" href="signup.html">Sign Up</a>
</div>

<script>
const toggle = document.getElementById("themeToggle");
let dark = true;

toggle.addEventListener("click", () => {
    dark = !dark;
    document.body.style.background = dark ? "#03030a" : "#f4f7ff";
    document.body.style.color = dark ? "#d8eaff" : "#111";
    toggle.textContent = dark ? "🌙" : "☀️";
});
</script>

<script type="module">
import { supabase } from './supabase.js';

// 🔐 CEK LOGIN (GANTI SESSION PHP)
const { data } = await supabase.auth.getSession();

if (data.session) {
    window.location.href = "upload.html";
}
</script>

</body>
</html>
